name: Build Nothing Phone 2 (Pong) — GKI Kernel + KernelSU-Next + SuSFS

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: |
          GKI kernel branch. Run "adb shell uname -r" on your device.
          5.10.x-android12-… → android12-5.10  (Nothing Phone 2 / Pong default)
          5.15.x-android13-… → android13-5.15
          5.15.x-android14-… → android14-5.15
        required: true
        default: 'android12-5.10'
        type: choice
        options:
          - android12-5.10
          - android13-5.15
          - android14-5.15
      lto:
        description: 'LTO mode — thin (faster build), full (most optimised), none (debug/CI test)'
        required: true
        default: 'thin'
        type: choice
        options:
          - thin
          - full
          - none

env:
  KERNEL_MANIFEST: https://android.googlesource.com/kernel/manifest
  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
  # rifsxd/KernelSU-Next: upstream fork that does not make direct SuSFS driver
  # calls, so it compiles cleanly against simonpunk's android12-5.10 SuSFS API.
  # SuSFS kernel hooks are still active; hiding is configured via the SuSFS
  # manager module rather than being auto-wired through the KSU driver.
  KSU_SETUP: https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh

jobs:
  build:
    name: GKI kernel + KernelSU-Next + SuSFS for Pong
    runs-on: ubuntu-22.04

    steps:
      # ── 1. Resolve branch names ──────────────────────────────────────────────
      # kernel/manifest uses 'common-' prefix for android12-5.10.
      # android13/14-5.15 branches are named as-is (Bazel/Kleaf build).
      # SuSFS: use -dev branches which carry the v2.x API that pershoot's
      # KSU-Next driver requires. The stable gki-android12-5.10 branch has the
      # older void** API which produces compile errors with the newer KSU driver.
      - name: Resolve manifest and SuSFS branch names
        run: |
          KBRANCH="${{ github.event.inputs.kernel_branch }}"
          case "$KBRANCH" in
            android12-5.10)
              MANIFEST_BRANCH="common-android12-5.10"
              SUSFS_BRANCH="gki-android12-5.10-dev"
              BUILD_SYSTEM="make"
              ;;
            android13-5.15)
              MANIFEST_BRANCH="android13-5.15"
              SUSFS_BRANCH="gki-android13-5.15-dev"
              BUILD_SYSTEM="bazel"
              ;;
            android14-5.15)
              MANIFEST_BRANCH="android14-5.15"
              SUSFS_BRANCH="gki-android14-5.15-dev"
              BUILD_SYSTEM="bazel"
              ;;
            *)
              MANIFEST_BRANCH="$KBRANCH"
              SUSFS_BRANCH="gki-$KBRANCH-dev"
              BUILD_SYSTEM="bazel"
              ;;
          esac
          echo "MANIFEST_BRANCH=$MANIFEST_BRANCH"   >> "$GITHUB_ENV"
          echo "SUSFS_BRANCH=$SUSFS_BRANCH"         >> "$GITHUB_ENV"
          echo "BUILD_SYSTEM=$BUILD_SYSTEM"          >> "$GITHUB_ENV"
          echo "Kernel input:      $KBRANCH"
          echo "Manifest branch:   $MANIFEST_BRANCH"
          echo "SuSFS branch:      $SUSFS_BRANCH"
          echo "Build system:      $BUILD_SYSTEM"

      # ── 2. Disk space ────────────────────────────────────────────────────────
      - name: Free disk space
        run: |
          echo "=== Disk before cleanup ===" && df -h
          sudo apt-get remove -yq \
            '^dotnet-.*' '^llvm-.*' '^mono-.*' \
            azure-cli google-cloud-sdk google-chrome-stable \
            firefox powershell 2>/dev/null || true
          sudo apt-get autoremove -yq
          sudo apt-get clean
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/local/share/powershell
          echo "=== Disk after cleanup ===" && df -h

      # ── 3. Checkout ──────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── 4. Dependencies ──────────────────────────────────────────────────────
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yq --no-install-recommends \
            python3 python3-pip python-is-python3 \
            git curl wget bc bison flex \
            libssl-dev libelf-dev \
            build-essential cpio zip unzip \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

          # repo tool
          mkdir -p ~/.local/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
            -o ~/.local/bin/repo
          chmod +x ~/.local/bin/repo
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          git config --global user.name  "Build Bot"
          git config --global user.email "build@localhost"
          git config --global color.ui false

      # ── 5. SuSFS source ──────────────────────────────────────────────────────
      - name: Clone SuSFS (${{ github.event.inputs.kernel_branch }})
        run: |
          echo "Cloning SuSFS branch: $SUSFS_BRANCH"
          git clone --depth 1 --no-tags \
            -b "$SUSFS_BRANCH" \
            "$SUSFS_REPO" susfs4ksu

      # ── 6. Kernel source ─────────────────────────────────────────────────────
      - name: Init kernel manifest (${{ github.event.inputs.kernel_branch }})
        run: |
          mkdir -p kernel-src
          cd kernel-src
          repo init \
            --no-clone-bundle --no-tags --depth=1 \
            -u "$KERNEL_MANIFEST" \
            -b "$MANIFEST_BRANCH"

      - name: Sync kernel sources
        run: |
          cd kernel-src
          repo sync -c --no-tags --no-clone-bundle -j$(nproc)

      # ── 7. SuSFS kernel patches ──────────────────────────────────────────────
      - name: Apply SuSFS kernel patches
        run: |
          KBRANCH="${{ github.event.inputs.kernel_branch }}"
          COMMON="kernel-src/common"

          cp -v susfs4ksu/kernel_patches/fs/*              "$COMMON/fs/"
          cp -v susfs4ksu/kernel_patches/include/linux/*   "$COMMON/include/linux/"
          cp -v susfs4ksu/kernel_patches/*.patch            "$COMMON/" 2>/dev/null || true

          cd "$COMMON"

          MAIN_PATCH="50_add_susfs_in_gki-${KBRANCH}.patch"
          if [ ! -f "$MAIN_PATCH" ]; then
            echo "ERROR: patch not found: $MAIN_PATCH"
            echo "Available patches:"; ls *.patch 2>/dev/null || echo "(none)"
            exit 1
          fi
          echo "Applying $MAIN_PATCH ..."
          patch -p1 -ui "$MAIN_PATCH"

          if [ -f "60_scope-minimized_manual_hooks.patch" ]; then
            echo "Applying 60_scope-minimized_manual_hooks.patch ..."
            patch -p1 -ui "60_scope-minimized_manual_hooks.patch"
          fi

      # ── 8. KernelSU-Next ─────────────────────────────────────────────────────
      - name: Integrate KernelSU-Next
        run: |
          cd kernel-src
          curl -LSs "$KSU_SETUP" | bash -s next

      # ── 9. Protected-exports removal (Bazel builds only — fixes Wi-Fi/BT) ────
      - name: Remove protected exports (Bazel builds)
        if: env.BUILD_SYSTEM == 'bazel'
        run: |
          cd kernel-src
          sed -i \
            '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' \
            common/BUILD.bazel
          rm -f common/android/abi_gki_protected_exports_*

      - name: Clean stray patch files
        run: rm -f kernel-src/common/*.patch

      # ── 10. Commit integrated tree ───────────────────────────────────────────
      - name: Commit patched kernel tree
        run: |
          cd kernel-src/common
          git add -A
          git commit -m "Nothing Phone 2 (Pong): integrate KernelSU-Next + SuSFS"

      # ── 11. Build ────────────────────────────────────────────────────────────
      - name: Build GKI kernel — Bazel (android13-5.15 / android14-5.15)
        if: env.BUILD_SYSTEM == 'bazel'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          cd kernel-src
          tools/bazel run \
            --config=fast \
            --config=stamp \
            --lto=${{ github.event.inputs.lto }} \
            //common:kernel_aarch64_dist \
            -- --dist_dir="$GITHUB_WORKSPACE/out"

      - name: Build GKI kernel — Make/build.sh (android12-5.10)
        if: env.BUILD_SYSTEM == 'make'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          cd kernel-src
          LTO=${{ github.event.inputs.lto }} \
          BUILD_CONFIG=common/build.config.gki.aarch64 \
          DIST_DIR="$GITHUB_WORKSPACE/out" \
          build/build.sh

      # ── 12. Assemble boot.img (Make builds only) ────────────────────────────
      # build/build.sh produces a raw Image but not a boot.img.
      # For GKI 2.0 (header v3) the boot partition contains only the kernel —
      # the ramdisk lives in vendor_boot.img which we never touch.
      - name: Create boot.img from kernel Image (android12-5.10)
        if: env.BUILD_SYSTEM == 'make'
        run: |
          OUTDIR="$GITHUB_WORKSPACE/out"
          pip3 install mkbootimg --quiet

          # Prefer lz4-compressed image if present
          if [ -f "$OUTDIR/Image.lz4" ]; then
            KERNEL="$OUTDIR/Image.lz4"
          else
            KERNEL="$OUTDIR/Image"
          fi

          echo "Building boot.img from: $KERNEL"
          mkbootimg \
            --header_version 3 \
            --kernel "$KERNEL" \
            --output "$OUTDIR/boot.img"

          ls -lh "$OUTDIR/boot.img"

      # ── 13. Artifacts ────────────────────────────────────────────────────────
      - name: List build output
        run: ls -lh "$GITHUB_WORKSPACE/out/"

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: pong-boot-${{ github.event.inputs.kernel_branch }}-ksu-susfs
          path: out/boot.img
          if-no-files-found: warn
          retention-days: 14

      - name: Upload full kernel package
        uses: actions/upload-artifact@v4
        with:
          name: pong-kernel-full-${{ github.event.inputs.kernel_branch }}
          path: |
            out/Image
            out/Image.lz4
            out/System.map
            out/vmlinux
          if-no-files-found: warn
          retention-days: 14
